<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2559" />
      <stop offset="100%" stop-color="#12193F" />
    </linearGradient>

    <radialGradient id="sageGlow" cx="8%" cy="8%" r="40%">
      <stop offset="0%" stop-color="#4A7C59" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#4A7C59" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4A7C59" stop-opacity="0"/>
    </radialGradient>


    <filter id="grain">
      <feTurbulence baseFrequency="0.012" numOctaves="3" stitchTiles="stitch" seed="9" result="t"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay" />
    </filter>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- base gradient -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- soft colored glows -->
  <rect width="100%" height="100%" fill="url(#sageGlow)" filter="url(#softBlur)" opacity="0.9" />

  <!-- very subtle concentric rings top-right -->
  <g transform="translate(840,120)" opacity="0.9">
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  </g>

  <!-- delicate particles -->
  <g fill="rgba(255,255,255,0.06)" opacity="0.95">
    <circle cx="160" cy="420" r="1.6" />
    <circle cx="220" cy="680" r="1.2" />
    <circle cx="520" cy="320" r="1.4" />
    <circle cx="760" cy="500" r="1.1" />
    <circle cx="980" cy="1600" r="1.3" />
    <circle cx="420" cy="1300" r="1.0" />
    <circle cx="660" cy="900" r="1.6" />
    <circle cx="940" cy="240" r="1.0" />
  </g>

  <!-- faint washi crosshatch: two thin patterns -->
  <g opacity="0.03" fill="none" stroke="#ffffff">
    <g stroke-width="1">
      <!-- horizontal subtle lines -->
      <path d="M0 6 H1080 M0 18 H1080 M0 30 H1080 M0 42 H1080 M0 54 H1080" />
    </g>
    <g stroke-width="1">
      <!-- vertical subtle lines -->
      <path d="M6 0 V1920 M18 0 V1920 M30 0 V1920 M42 0 V1920 M54 0 V1920" />
    </g>
  </g>

  <!-- fine grain overlay -->
  <rect width="100%" height="100%" filter="url(#grain)" fill="#ffffff" opacity="0.02" />

  <!-- safe area marker (invisible) for text overlay guidance: large left area remains visually calmer -->
  <!-- (no visible text) -->

</svg>
